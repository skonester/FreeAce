version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Chicago
    ignore:
      # Keep the JavaScript updater aligned with the patched Rust updater.
      - dependency-name: "@tauri-apps/plugin-updater"
    groups:
      dev-dependencies:
        dependency-type: development
      tauri:
        patterns:
          - "@tauri-apps/*"

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Chicago
    ignore:
      # Upgrade with Tauri so macOS links only one window-vibrancy version.
      - dependency-name: window-vibrancy
    groups:
      tauri:
        patterns:
          - "tauri*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Chicago
