name: Windows build

# Primary build for FreeAce: unsigned NSIS installers for Windows x64 and
# ARM64 on every push to main, plus on demand. No code signing, no release
# publishing, no Win11 sparse context-menu package (that needs Authenticode).
# Users download the artifact and run it; SmartScreen shows the usual
# unknown-publisher prompt for unsigned installers.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "12.0.2"
  RUST_VERSION: "stable"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci --ignore-scripts

      # Same steps `npm run tauri:build` runs locally, minus sync-version
      # (the committed version files are the source of truth in CI).
      - run: npm run licenses
      - run: npm run prepare:7z
      - run: npm run prepare:freeace

      - name: Build app + NSIS installer
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Upload app exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freeace-windows-${{ matrix.arch }}-exe
          path: src-tauri/target/${{ matrix.target }}/release/freeace.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freeace-windows-${{ matrix.arch }}-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
