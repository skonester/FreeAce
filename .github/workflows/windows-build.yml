name: Windows build

# Manual/on-demand Windows build. Produces the plain app .exe and the
# unsigned NSIS installer as downloadable artifacts. No code signing, no
# release publishing, no context-menu shell extension -- just the two files.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"
  RUST_VERSION: "stable"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - run: npm ci --ignore-scripts

      # Real 7z + Gleipnir sidecars, built from source for this runner.
      - run: npm run prepare:7z
      - run: npm run prepare:freeace

      # Empty stubs: skips the signed Win11 context-menu shell extension,
      # which is not built by this workflow.
      - run: npm run prepare:win-shell-stubs

      - name: Build app + NSIS installer
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload app exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa9 # v4.6.2
        with:
          name: freeace-windows-x64-exe
          path: src-tauri/target/x86_64-pc-windows-msvc/release/freeace.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa9 # v4.6.2
        with:
          name: freeace-windows-x64-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
